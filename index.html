<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>NoteVault</title>
  </head>
  <body>
    <!-- particles background -->
    <div id="tsparticles"></div>

    <nav>
      <div class="sign-in-sign-up">Sign In/Sign Up</div>
    </nav>
    <main class="homepage-container">
      <div class="left-section">
        <h1 class="heading">NoteVault</h1>
        <h3 class="sub-heading">
          Capture ideas, organize thoughts, and access your notes from a single
          workspace.
        </h3>
      </div>
      <div class="right-section">
        <img
          class="homepage-illustration"
          src="./assets/homepage-illustration.svg"
          alt="illustration"
        />
      </div>
    </main>

    <!-- tsParticles -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script>
      tsParticles.load("tsparticles", {
        fullScreen: { enable: false },
        background: { color: "transparent" },
        particles: {
          number: { value: 120, density: { enable: true, area: 800 } },
          color: { value: ["#ffffff", "#d4aaff"] },
          shape: { type: "circle" },
          opacity: { value: { min: 0.2, max: 0.5 } },
          size: { value: { min: 1, max: 2.5 } },
          move: {
            enable: true,
            speed: 0.4,
            direction: "none",
            random: false,
            outModes: "out",
          },
          links: {
            enable: true,
            distance: 100,
            color: "#ffffff",
            opacity: 0.18,
            width: 0.8,
          },
        },
        interactivity: {
          events: {
            onHover: { enable: true, mode: "grab" },
            onClick: { enable: true, mode: "push" },
          },
          modes: {
            grab: { distance: 130, links: { opacity: 0.6 } },
            push: { quantity: 4 },
          },
        },
      });
    </script>

    <!-- js -->
    <script src="./index.js"></script>
  </body>
</html>
